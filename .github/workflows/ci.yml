name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for the PII/secret scan
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Space files stay Python 3.10 compatible (Hugging Face ZeroGPU runs 3.10)
        run: ruff check --target-version py310 --select E9,F hf_space/app.py src/waste_cls/models.py src/waste_cls/gradcam.py
      - name: Personal data and secret scan, full history
        run: python scripts/pii_scan.py
      - name: Check README numbers against results.json
        run: python scripts/check_readme_claims.py
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Smoke run from the README
        run: python -m waste_cls.cli run --config smoke --out runs/smoke
